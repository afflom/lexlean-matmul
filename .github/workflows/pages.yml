name: verified LexLean GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: matmul-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    outputs:
      native-artifact-id: ${{ steps.native-release.outputs.artifact-id }}
      native-artifact-digest: ${{ steps.native-release.outputs.artifact-digest }}
      pages-artifact-id: ${{ steps.pages-release.outputs.artifact_id }}
    # Full acceptance includes eight application generations, native release
    # verification, independent oracles, and all planted defects.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Execute the complete acceptance boundary in the immutable SDK
        run: ./scripts/in-sdk.sh just vv
      - name: Stage the exact verified browser projection
        run: ./scripts/in-sdk.sh just pages
      - name: Capture accepted native OCI and source-free publication evidence
        run: ./scripts/in-sdk.sh node scripts/system-release.mjs bundle
      - name: Retain the inert native release bundle
        id: native-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lexlean-matmul-native-release
          path: .prism/matmul/browser-release-bundle
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload the unchanged Pages artifact
        id: pages-release
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public
          retention-days: 30
      - name: Capture bounded acceptance observations and outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          NATIVE_ID: ${{ steps.native-release.outputs.artifact-id }}
          NATIVE_DIGEST: ${{ steps.native-release.outputs.artifact-digest }}
          PAGES_ID: ${{ steps.pages-release.outputs.artifact_id }}
        run: ./scripts/in-sdk.sh node scripts/publication-evidence.mjs capture acceptance "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$JOB_STATUS" "" "$NATIVE_ID" "$NATIVE_DIGEST" "$PAGES_ID"
      - name: Retain acceptance observations, including failed gates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lexlean-matmul-acceptance-evidence
          path: .prism/matmul/retained/acceptance
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: github.ref == 'refs/heads/main' && github.ref_protected && github.event_name != 'pull_request'
    needs: acceptance
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the accepted execution commit to remain current protected main
        run: ./scripts/in-sdk.sh node scripts/publication-evidence.mjs current-main "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REF" "${{ github.ref_protected }}"
      - name: Deploy the accepted artifact without rebuilding
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Capture the deployment freshness observation and outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
          NATIVE_ID: ${{ needs.acceptance.outputs.native-artifact-id }}
          NATIVE_DIGEST: ${{ needs.acceptance.outputs.native-artifact-digest }}
          PAGES_ID: ${{ needs.acceptance.outputs.pages-artifact-id }}
        run: ./scripts/in-sdk.sh node scripts/publication-evidence.mjs capture deployment "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$JOB_STATUS" "$DEPLOYED_URL" "$NATIVE_ID" "$NATIVE_DIGEST" "$PAGES_ID"
      - name: Retain the deployment outcome and freshness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lexlean-matmul-deployment-evidence
          path: .prism/matmul/retained/deployment
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-publication:
    needs: [acceptance, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-pages
          path: .prism/pages-publication
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lexlean-matmul-native-release
          path: .prism/matmul/browser-release-bundle
      - name: Verify the accepted OCI browser closure through the source-free SDK API
        env:
          DEPLOYED_URL: ${{ needs.deploy.outputs.url }}
        run: ./scripts/in-sdk.sh node scripts/system-release.mjs verify-bundle .prism/matmul/browser-release-bundle "$DEPLOYED_URL"
      - name: Verify every published HTTPS byte against the uploaded archive
        env:
          DEPLOYED_URL: ${{ needs.deploy.outputs.url }}
        run: |
          mkdir -p public
          tar -xf .prism/pages-publication/artifact.tar -C public
          ./scripts/in-sdk.sh node scripts/verify-publication.mjs "$DEPLOYED_URL"
      - name: Capture both publication observations and outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYED_URL: ${{ needs.deploy.outputs.url }}
          NATIVE_ID: ${{ needs.acceptance.outputs.native-artifact-id }}
          NATIVE_DIGEST: ${{ needs.acceptance.outputs.native-artifact-digest }}
          PAGES_ID: ${{ needs.acceptance.outputs.pages-artifact-id }}
        run: ./scripts/in-sdk.sh node scripts/publication-evidence.mjs capture publication "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$JOB_STATUS" "$DEPLOYED_URL" "$NATIVE_ID" "$NATIVE_DIGEST" "$PAGES_ID"
      - name: Retain final publication observations, including failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lexlean-matmul-publication-evidence
          path: .prism/matmul/retained/publication
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
